name: Test Build Tools

on: [push, pull_request, workflow_dispatch]

jobs:
  TestBuildTools:
    name: Test build-tools
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python-version: [3.9, 3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade PIP
        run: python -m pip install --upgrade pip

      - name: Install wheel
        run: python -m pip install wheel

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install build-tools
        run: python -m pip install .

      - name: Run tests
        run: pytest
      - name: Sanity check submit_build.py script
        run: |
          export VSC_ARCH_LOCAL=skylake
          export VSC_ARCH_SUFFIX=-ib
          export VSC_OS_LOCAL=RL8
          export VSC_INSTITUTE_CLUSTER=hydra
          export VSC_DEFAULT_CLUSTER_MODULE=hydra
          submit_build.py --help
